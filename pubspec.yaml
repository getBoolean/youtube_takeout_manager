name: youtube_takeout_manager
description: "A Flutter app to manage YouTube Takeout data - view and delete comments and live chats."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2
  archive: ^4.0.9
  csv: ^8.0.0
  file_picker: ^11.0.2
  auto_route: ^11.1.0
  intl: ^0.20.2
  dart_mappable: ^4.7.0
  googleapis: ^16.0.0
  googleapis_auth: ^2.0.0
  shared_preferences: ^2.5.5
  path_provider: ^2.1.5
  http: ^1.6.0
  flutter_secure_storage: ^10.0.0
  url_launcher: ^6.3.2
  path: ^1.9.1
  file_saver: ^0.3.1
  web: ^1.1.1
  flutter_hooks: ^0.21.3+1
  hooks_riverpod: ^3.3.1
  cue: ^0.1.2+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.13.1
  dart_mappable_builder: ^4.7.0
  auto_route_generator: ^10.4.0
  riverpod_generator: ^4.0.3
  unicode_emojis: ^0.5.1
  analyzer: 9.0.0
  test: ^1.31.1

flutter:
  uses-material-design: true
  assets:
    - assets/scripts/
