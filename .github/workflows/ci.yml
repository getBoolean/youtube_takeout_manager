name: CI

on:
  # Every branch; tags are Release's.
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or pull request supersedes a running one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      version: ci-${{ github.run_number }}
